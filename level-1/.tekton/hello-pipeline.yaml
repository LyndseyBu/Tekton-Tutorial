apiVersion: tekton.dev/v1alpha1
kind: Pipeline
metadata:
  name: hello-pipeline
spec:
  params:
    - name: pipeline-name
      type: string
      value: "my-pipeline"
      description: The name of the pipeline
  tasks:
    - name: skipped-task
      taskRef:
        name: skipped-task
      when:
        - input: "$(params.skip)"
          operator: in
          values: ["true"]
    - name: pipeline-hello-task2
      taskRef:
        name: hello-task2
    - name: pipeline-hello-task3
      taskRef:
        name: hello-task3
